name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify design-system boundary
        run: npm run check:design-system

      - name: Typecheck and build
        run: npm run build

      - name: Validate Cloudflare Worker bundle (dry run only)
        run: npm run worker:validate

      - name: Package Worker deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: tradepilot-worker-bundle-${{ github.sha }}
          path: |
            .wrangler/dry-run/
            dist/client/
          if-no-files-found: error
          retention-days: 1

      - name: Deploy TradePilot Worker to production
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Deployment skipped: configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub Actions secrets."
            exit 0
          fi
          npm run worker:deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
