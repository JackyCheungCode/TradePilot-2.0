name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: tradepilot-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradepilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
      - name: Validate trade lifecycle migrations in isolated PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: tradepilot_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bash scripts/test-trade-lifecycle-migrations.sh

      - name: Validate private ClamAV scanner service
        run: |
          node --check services/inbox-scanner/server.mjs
          node --test services/inbox-scanner/server.test.mjs
          SCANNER_HMAC_SECRET=$(printf 'a%.0s' {1..64}) docker compose -f services/inbox-scanner/docker-compose.yml config --quiet
      - name: Test server-side discovery guardrails
        run: npm run test:guardrails
      - name: Verify design-system boundary
        run: npm run check:design-system

      - name: Typecheck and build
        run: npm run build

      - name: Validate Cloudflare Worker bundle (dry run only)
        run: npm run worker:validate

      - name: Package Worker deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: tradepilot-worker-bundle-${{ github.sha }}
          path: |
            .wrangler/dry-run/
            dist/client/
          if-no-files-found: error
          retention-days: 1

      # Production deploy is part of the same CI run. It can execute only for
      # a push to develop and only after every validation/build/package step
      # above has succeeded. Pull requests never receive the deployment secret.
      - name: Verify Cloudflare deployment secret is configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Production deploy blocked: repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          echo "Cloudflare deployment secret is configured (value not displayed)."

      - name: Deploy production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea4e98dce9c478d7dd5c07f10e5c722d
        run: npm run worker:deploy

