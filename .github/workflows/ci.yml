name: CI

on:
  push:
    branches:
      - main
      - develop
      - standalone/developer-handoff
  pull_request:
    branches:
      - main
      - develop
      - standalone/developer-handoff

permissions:
  contents: read

concurrency:
  group: tradepilot-standalone-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-bootstrap:
    name: Clean Supabase database bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start isolated Supabase stack
        run: supabase start --exclude studio,logflare,vector,edge-runtime,mailpit

      - name: Apply every migration to a clean local database
        run: supabase db reset

      - name: Test monitoring bootstrap and access controls
        run: supabase test db supabase/tests/monitoring-bootstrap.test.sql

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradepilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate trade lifecycle migrations in isolated PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: tradepilot_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bash scripts/test-trade-lifecycle-migrations.sh

      - name: Validate standalone monitoring database bootstrap
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: tradepilot_test
        run: npm run test:monitoring-bootstrap

      - name: Validate private ClamAV scanner service
        run: |
          node --check services/inbox-scanner/server.mjs
          node --test services/inbox-scanner/server.test.mjs
          SCANNER_HMAC_SECRET=$(printf 'a%.0s' {1..64}) docker compose -f services/inbox-scanner/docker-compose.yml config --quiet

      - name: Test server-side discovery guardrails
        run: npm run test:guardrails

      - name: Verify design-system boundary
        run: npm run check:design-system

      - name: Typecheck and build
        run: npm run build

      - name: Validate Cloudflare Worker bundle (dry run only)
        run: npm run worker:validate

      - name: Production deployment is disabled in CI
        run: echo "CI validation only. Use the manually approved standalone deployment workflow."
