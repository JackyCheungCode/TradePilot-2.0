name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradepilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --package-lock=true
      - name: Emit generated npm lockfile for repository commit
        run: |
          python3 - <<'PY'
          import base64, hashlib
          data = open("package-lock.json", "rb").read()
          encoded = base64.b64encode(data).decode("ascii")
          print("LOCKFILE_BYTES=" + str(len(data)))
          print("LOCKFILE_SHA256=" + hashlib.sha256(data).hexdigest())
          chunk_size = 12000
          for index in range(0, len(encoded), chunk_size):
              print("LOCKFILE_CHUNK_%04d=%s" % (index // chunk_size, encoded[index:index + chunk_size]))
          PY
      - name: Validate trade lifecycle migrations in isolated PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: tradepilot_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bash scripts/test-trade-lifecycle-migrations.sh

      - name: Validate private ClamAV scanner service
        run: |
          node --check services/inbox-scanner/server.mjs
          node --test services/inbox-scanner/server.test.mjs
          SCANNER_HMAC_SECRET=$(printf 'a%.0s' {1..64}) docker compose -f services/inbox-scanner/docker-compose.yml config --quiet
      - name: Test server-side discovery guardrails
        run: npm run test:guardrails
      - name: Verify design-system boundary
        run: npm run check:design-system

      - name: Typecheck and build
        run: npm run build

      - name: Validate Cloudflare Worker bundle (dry run only)
        run: npm run worker:validate

      - name: Package Worker deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: tradepilot-worker-bundle-${{ github.sha }}
          path: |
            .wrangler/dry-run/
            dist/client/
            package-lock.json
          if-no-files-found: error
          retention-days: 1

