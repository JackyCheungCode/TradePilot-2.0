name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify design-system boundary
        run: npm run check:design-system

      - name: Typecheck and build
        run: npm run build

      - name: Validate Cloudflare Worker bundle (dry run only)
        run: npm run worker:validate

      - name: Package Worker deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: tradepilot-worker-bundle-${{ github.sha }}
          path: |
            .wrangler/dry-run/
            dist/client/
          if-no-files-found: error
          retention-days: 1
