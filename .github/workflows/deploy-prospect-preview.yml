name: Deploy TradePilot Prospect Discovery Preview

on:
  push:
    branches:
      - develop
    paths:
      - "src/**"
      - "worker/**"
      - "public/**"
      - "index.html"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
      - "wrangler.prospect-preview.jsonc"
      - ".github/workflows/deploy-prospect-preview.yml"

permissions:
  contents: read

concurrency:
  group: tradepilot-prospect-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact develop commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build and validate
        run: npm run build

      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea4e98dce9c478d7dd5c07f10e5c722d
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Preview deployment blocked: CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          npx wrangler deploy --config wrangler.prospect-preview.jsonc
