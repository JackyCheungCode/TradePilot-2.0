name: Deploy TradePilot Worker

on:
  # Deploy automatically only after the CI workflow succeeds on develop.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Keep a manual recovery path, restricted to develop.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradepilot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'develop') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated develop commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend and validate Worker
        run: npm run build && npm run worker:validate

      - name: Deploy existing TradePilot Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea4e98dce9c478d7dd5c07f10e5c722d
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Deployment blocked: repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          npm run worker:deploy
