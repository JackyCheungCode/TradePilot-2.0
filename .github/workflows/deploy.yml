name: Deploy TradePilot Standalone

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Type approved only after verifying your own Cloudflare and Supabase resources"
        required: true
        type: choice
        options:
          - hold
          - approved
        default: hold

permissions:
  contents: read

concurrency:
  group: tradepilot-standalone-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.ref == 'refs/heads/main' && inputs.release_confirmation == 'approved'
    runs-on: ubuntu-latest
    environment: standalone-production
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build and validate application
        run: npm run build && npm run worker:validate

      - name: Verify independent Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure your own CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi

      - name: Deploy to your own Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run worker:deploy
