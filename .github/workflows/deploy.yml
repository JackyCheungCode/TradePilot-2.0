name: Deploy TradePilot Worker

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend and validate Worker
        run: npm run build && npm run worker:validate

      - name: Deploy existing TradePilot Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea4e98dce9c478d7dd5c07f10e5c722d
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Deployment skipped: repository secret CLOUDFLARE_API_TOKEN is not configured."
            echo "Add it in GitHub repository Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 0
          fi
          npm run worker:deploy
