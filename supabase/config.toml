project_id = "tradepilot-standalone"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "2MiB"

[storage.buckets."crm-assets"]
public = true
file_size_limit = "5MiB"

[storage.buckets."payment-documents"]
public = false
file_size_limit = "15MiB"

[storage.buckets."product-assets"]
public = false
file_size_limit = "15MiB"

[storage.buckets."trade-document-files"]
public = false
file_size_limit = "25MiB"
