services:
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      - clamav-db:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    expose:
      - "3310"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3 --no-summary /dev/null >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m

  scanner-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      SCANNER_HMAC_SECRET: ${SCANNER_HMAC_SECRET:?Set SCANNER_HMAC_SECRET in the environment}
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  clamav-db:
